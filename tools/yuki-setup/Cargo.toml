[package]
name = "yuki-setup"
version = "0.1.0-alpha.4"
edition = "2024"
rust-version = "1.96"
license = "AGPL-3.0-only"
publish = false

[dependencies]
getrandom = "=0.4.3"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
ssh-key = { version = "=0.6.7", default-features = false, features = ["std", "ed25519"] }
tar = { version = "=0.4.46", default-features = false }
tempfile = "=3.27.0"
toml = "=0.9.8"
zip = { version = "=9.5.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.6", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem"] }
