id = "trace"
version = "0.1.0-alpha.2"
program = "yuki-trace"
grants = ["command.invoke", "control.invoke", "tool.call"]
commands = ["/ai/trace/export"]

[[tools]]
name = "trace_query"
description = "Read one authorized page of the original execution, model and tool timeline"
parallel_read = false
cacheable = false
code_direct = true
schema = { type = "object", properties = { kind = { type = "string", enum = ["turn", "work", "event"] }, identity = { type = "string", minLength = 1, maxLength = 128 }, after = { type = "integer", minimum = 0 }, limit = { type = "integer", minimum = 1, maximum = 20 }, content = { type = "boolean", default = false } }, required = ["kind", "identity"], additionalProperties = false }
