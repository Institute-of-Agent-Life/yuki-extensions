id = "character"
version = "0.1.0-alpha.1"
program = "yuki-character"
grants = ["control.invoke", "tool.call"]

[[tools]]
name = "character_manage"
description = "Read or explicitly update the shared role and active SOUL using original core revisions"
parallel_read = false
cacheable = false
code_direct = true
schema = { type = "object", properties = { action = { type = "string", enum = ["public", "identity", "read", "soul", "update", "save_soul", "reload_soul"] }, body = { type = "object" } }, required = ["action"], additionalProperties = false }
