[package]
name = "yuki-local-agent"
version = "0.1.0-alpha.2"
edition = "2024"
rust-version = "1.96"
license = "AGPL-3.0-only"
publish = false

[dependencies]
serde_json = "=1.0.145"
yuki-plugin-sdk = "=1.0.0-alpha.12"
rusqlite = { version = "=0.37.0", features = ["bundled"] }
tiny_http = "=0.12.0"
ureq = { version = "=3.1.2", default-features = false }
tungstenite = { version = "=0.28.0", default-features = false, features = ["handshake"] }

[dev-dependencies]
tempfile = "=3.23.0"
