name: Extension Windows CI

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Exact extension PR merge commit
        required: true
        type: string
      card:
        description: Taskbook replay to run
        required: true
        type: choice
        options: ['EXT-020-status', 'EXT-025-native', 'EXT-025-release', 'EXT-025-published', 'EXT-026', 'EXT-026-release', 'EXT-026-published', 'EXT-028-release', 'EXT-028-published', 'EXT-035', 'EXT-035-scheduled-tools', 'EXT-035-context', 'EXT-036', 'EXT-036-release', 'EXT-036-published', 'EXT-037', 'EXT-040-published']
      core_revision:
        description: Exact source of the core Host candidate
        required: true
        type: string

env:
  PYTHONUTF8: "1"
  YUKI_CRATE_CACHE: ${{ github.workspace }}/.ci-transfer/cache/registry
  YUKI_RUST_BUILD_ROOT: ${{ github.workspace }}/.ci-transfer/rust-src

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - name: Check the requested revisions
        env:
          REVISION: ${{ inputs.revision }}
          CORE_REVISION: ${{ inputs.core_revision }}
        run: |
          foreach ($revision in @($env:REVISION, $env:CORE_REVISION)) {
            if ($revision -cnotmatch '\A[0-9a-f]{40}\z') { throw 'Expected a full commit SHA' }
          }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
          path: extensions
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: ${{ inputs.card != 'EXT-020-status' && !startsWith(inputs.card, 'EXT-036') && inputs.card != 'EXT-040-published' && inputs.card != 'EXT-025-release' && inputs.card != 'EXT-025-published' && !startsWith(inputs.card, 'EXT-026-') && !startsWith(inputs.card, 'EXT-028-') }}
        with:
          repository: Institute-of-Agent-Life/yuki-core
          ref: ${{ inputs.core_revision }}
          persist-credentials: false
          path: core
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: ci-driver
      - name: Prepare the pinned toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "PYTHONDONTWRITEBYTECODE=1" >> $env:GITHUB_ENV
      - name: Prepare the Host candidate from its checked source
        if: ${{ inputs.card != 'EXT-020-status' && !startsWith(inputs.card, 'EXT-036') && inputs.card != 'EXT-040-published' && inputs.card != 'EXT-025-release' && inputs.card != 'EXT-025-published' && !startsWith(inputs.card, 'EXT-026-') && !startsWith(inputs.card, 'EXT-028-') }}
        working-directory: core
        env:
          CORE_REVISION: ${{ inputs.core_revision }}
          EXTENSION_CARD: ${{ inputs.card }}
        run: |
          if ((git rev-parse HEAD) -cne $env:CORE_REVISION) { throw 'Wrong core checkout' }
          cargo fetch --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fetch --locked --manifest-path sdk/rust/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $card = switch ($env:EXTENSION_CARD) {
            'EXT-025-native' { 'CORE-050' }
            'EXT-026' { 'CORE-050' }
            'EXT-037' { 'CORE-037' }
            default { 'CORE-039' }
          }
          python -B ci/check.py $card --out artifacts/extension-windows/producer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $manifest = 'artifacts/extension-windows/producer/manifest.json'
          $destination = 'artifacts/extension-windows/candidate'
          if ($card -eq 'CORE-039') {
            python -B ci/candidate_job.py native --manifest $manifest --out $destination
          } else {
            python -B ci/host_candidate.py --manifest $manifest --out $destination
          }
      - name: Exercise the native extension and retain the original receipts
        if: ${{ inputs.card != 'EXT-020-status' && !startsWith(inputs.card, 'EXT-036') && inputs.card != 'EXT-040-published' && !startsWith(inputs.card, 'EXT-026') && !startsWith(inputs.card, 'EXT-025-') && !startsWith(inputs.card, 'EXT-028-') }}
        env:
          REVISION: ${{ inputs.revision }}
          CORE_REVISION: ${{ inputs.core_revision }}
          EXTENSION_CARD: ${{ inputs.card }}
          YUKI_CRATE_CACHE: ${{ github.workspace }}/crates
          YUKI_RUST_BUILD_ROOT: ${{ runner.temp }}/src
          YUKI_RUST_CACHE_ROOT: ${{ runner.temp }}/rust
        run: |
          python -B ci-driver/ci/windows_candidate_replay.py $env:EXTENSION_CARD $env:REVISION $env:CORE_REVISION extensions core/artifacts/extension-windows/candidate core/artifacts/extension-windows/producer/manifest.json windows-evidence
      - name: Replay the installed participation worker
        if: startsWith(inputs.card, 'EXT-025-') || startsWith(inputs.card, 'EXT-026')
        working-directory: extensions
        env:
          REVISION: ${{ inputs.revision }}
          CORE_REVISION: ${{ inputs.core_revision }}
          EXTENSION_CARD: ${{ inputs.card }}
        run: |
          if ((git rev-parse HEAD) -cne $env:REVISION) { throw 'Wrong extension checkout' }
          $lock = 'compat/participation-library/replay-requirements.txt'
          $pin = Get-Content 'compat/participation-library/source.lock.json' -Raw | ConvertFrom-Json
          $env:YUKI_PARTICIPATION_SOURCE = Join-Path $env:RUNNER_TEMP 'participation.tar.gz'
          Invoke-WebRequest -Uri $pin.source_url -OutFile $env:YUKI_PARTICIPATION_SOURCE
          $digest = (Get-FileHash -LiteralPath $env:YUKI_PARTICIPATION_SOURCE -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -cne $pin.source_sha256) { throw 'Wrong participation source' }
          $wheelhouse = Join-Path $env:RUNNER_TEMP 'participation-wheels'
          python -m pip download --require-hashes --only-binary=:all: --dest $wheelhouse -r $lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-index --require-hashes --find-links $wheelhouse -r $lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PYTHONPATH = 'ci'
          if ($env:EXTENSION_CARD -match '^(EXT-025|EXT-026)-(release|published)$') {
            $task = $Matches[1]
            $published = $Matches[2] -eq 'published'
            $baseVersion = if ($task -eq 'EXT-026') { '1.4.0' } else { '1.3.0' }
            $pluginVersion = if ($task -eq 'EXT-026') { '0.2.0' } else { '0.1.0' }
            $base = Get-Content "compat/stable-$($baseVersion.Substring(0,3))/source.lock.json" -Raw | ConvertFrom-Json
            if ($base.source_commit -cne $env:CORE_REVISION) { throw 'Wrong published Host source' }
            $asset = "yuki-plugin-base-$baseVersion.zip"
            $env:YUKI_PARTICIPATION_STABLE_HOST = Join-Path $env:RUNNER_TEMP $asset
            Invoke-WebRequest -Uri "https://github.com/Institute-of-Agent-Life/yuki-core/releases/download/plugin-base-v$baseVersion/$asset" -OutFile $env:YUKI_PARTICIPATION_STABLE_HOST
            if ($published) {
              $release = Get-Content "compat/participation-$pluginVersion/release.lock.json" -Raw | ConvertFrom-Json
              $env:YUKI_PARTICIPATION_RELEASE = Join-Path $env:RUNNER_TEMP 'participation-windows.zip'
              Invoke-WebRequest -Uri $release.platforms.windows.url -OutFile $env:YUKI_PARTICIPATION_RELEASE
              python -B ci/check.py $task --out ../windows-evidence
            } else {
              python -B ci/check.py $task --preparation --out ../windows-evidence
            }
            exit $LASTEXITCODE
          }
          $candidate = Get-ChildItem '../core/artifacts/extension-windows/candidate/yuki-aux-model-preview-*.zip'
          if (@($candidate).Count -ne 1) { throw 'Expected one verified CORE-050 candidate' }
          $env:YUKI_CORE050_CANDIDATE = $candidate.FullName
          $env:YUKI_CORE050_MANIFEST = (Resolve-Path '../core/artifacts/extension-windows/producer/manifest.json').Path
          if ($env:EXTENSION_CARD -eq 'EXT-026') {
            python -B ci/check.py EXT-026 --preparation --out ../windows-evidence
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            python -B ci/check.py EXT-025 --preparation --out ../windows-evidence/ordinary-regression
            exit $LASTEXITCODE
          }
          python -B ci/check.py EXT-025 --preparation --out ../windows-evidence
          exit $LASTEXITCODE
      - name: Replay the Rust environment or web-fetch package with the published Host
        if: inputs.card == 'EXT-020-status' || startsWith(inputs.card, 'EXT-028-')
        working-directory: extensions
        env:
          REVISION: ${{ inputs.revision }}
          CORE_REVISION: ${{ inputs.core_revision }}
          EXTENSION_CARD: ${{ inputs.card }}
        run: |
          if ((git rev-parse HEAD) -cne $env:REVISION) { throw 'Wrong extension checkout' }
          $base = Get-Content compat/stable-1.0/source.lock.json -Raw | ConvertFrom-Json
          if (!$base.published -or $base.source_commit -cne $env:CORE_REVISION) { throw 'Wrong published Host source' }
          $target = $base.platforms.'windows-x86_64'
          $bundle = Join-Path $env:RUNNER_TEMP $target.archive
          Invoke-WebRequest -Uri ("https://github.com/Institute-of-Agent-Life/yuki-core/releases/download/" + $base.tag + "/" + $target.archive) -OutFile $bundle
          if ((Get-FileHash $bundle -Algorithm SHA256).Hash.ToLowerInvariant() -cne $target.sha256) { throw 'Wrong Host archive' }
          $env:PYTHONPATH = Join-Path (Get-Location) 'ci'
          if ($env:EXTENSION_CARD -eq 'EXT-020-status') {
            $env:YUKI_STABLE_BASE_ZIP = $bundle
            python -B ci/check.py EXT-020 --preparation --out ../windows-evidence
            exit $LASTEXITCODE
          }
          $env:YUKI_WEB_FETCH_RELEASE_HOST = $bundle
          if ($env:EXTENSION_CARD -eq 'EXT-028-published') {
            $release = Get-Content 'compat/web-fetch-0.1.0/release.lock.json' -Raw | ConvertFrom-Json
            $env:YUKI_WEB_FETCH_RELEASE = Join-Path $env:RUNNER_TEMP 'web-fetch-windows.zip'
            Invoke-WebRequest -Uri $release.platforms.windows.url -OutFile $env:YUKI_WEB_FETCH_RELEASE
            python -B ci/check.py EXT-028 --out ../windows-evidence
          } else {
            python -B ci/check.py EXT-028 --preparation --out ../windows-evidence
          }
          exit $LASTEXITCODE
      - name: Replay EXT-036 against the published Host
        if: startsWith(inputs.card, 'EXT-036')
        working-directory: extensions
        env:
          REVISION: ${{ inputs.revision }}
          CORE_REVISION: ${{ inputs.core_revision }}
          EXTENSION_CARD: ${{ inputs.card }}
        run: |
          if ((git rev-parse HEAD) -cne $env:REVISION) { throw 'Wrong extension checkout' }
          $pin = Get-Content compat/stable-1.2/source.lock.json -Raw | ConvertFrom-Json
          if ($pin.source_commit -cne $env:CORE_REVISION) { throw 'Wrong published Host source' }
          $asset = 'yuki-plugin-base-1.2.0.zip'
          $env:YUKI_STABLE_1_2_BUNDLE = Join-Path $env:RUNNER_TEMP $asset
          Invoke-WebRequest -Uri ("https://github.com/Institute-of-Agent-Life/yuki-core/releases/download/plugin-base-v1.2.0/" + $asset) -OutFile $env:YUKI_STABLE_1_2_BUNDLE
          $env:PYTHONPATH = Join-Path (Get-Location) 'ci'
          if ($env:EXTENSION_CARD -eq 'EXT-036-release') {
            $env:YUKI_MAINTENANCE_RELEASE_CANDIDATE = '1'
          }
          if ($env:EXTENSION_CARD -eq 'EXT-036-published') {
            $worker = 'yuki-memory-maintenance-0.1.0-windows.zip'
            $env:YUKI_MAINTENANCE_RELEASE_ZIP = Join-Path $env:RUNNER_TEMP $worker
            Invoke-WebRequest -Uri ("https://github.com/Institute-of-Agent-Life/yuki-extensions/releases/download/plugin/memory-maintenance/v0.1.0/" + $worker) -OutFile $env:YUKI_MAINTENANCE_RELEASE_ZIP
          }
          $replay = Join-Path $env:RUNNER_TEMP 'yuki36'
          python -B ci/check.py EXT-036 --out $replay
          $result = $LASTEXITCODE
          $output = New-Item -ItemType Directory -Path ../windows-evidence
          Get-ChildItem -LiteralPath $replay -File | Copy-Item -Destination $output.FullName
          if (Test-Path (Join-Path $replay 'work/wire.jsonl')) {
            Copy-Item (Join-Path $replay 'work/wire.jsonl') (Join-Path $output.FullName 'observed-wire.jsonl')
          }
          $package = Join-Path $replay 'packages'
          if (Test-Path (Join-Path $package 'package-manifest.json')) {
            Copy-Item -LiteralPath $package -Destination $output.FullName -Recurse
          }
          exit $result
      - name: Verify the offline installer with the published minor versions
        if: inputs.card == 'EXT-040-published'
        working-directory: extensions
        env:
          REVISION: ${{ inputs.revision }}
          CORE_REVISION: ${{ inputs.core_revision }}
        run: |
          if ((git rev-parse HEAD) -cne $env:REVISION) { throw 'Wrong extension checkout' }
          $pin = Get-Content compat/stable-1.4/source.lock.json -Raw | ConvertFrom-Json
          if ($pin.source_commit -cne $env:CORE_REVISION) { throw 'Wrong published Host source' }
          foreach ($version in @('1.1.0', '1.2.0', '1.3.0', '1.4.0')) {
            $directory = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP $version)
            $asset = "yuki-plugin-base-$version.zip"
            foreach ($name in @($asset, 'manifest.json', 'signer.pub', 'SHA256SUMS', 'SHA256SUMS.sig')) {
              Invoke-WebRequest -Uri ("https://github.com/Institute-of-Agent-Life/yuki-core/releases/download/plugin-base-v$version/" + $name) -OutFile (Join-Path $directory.FullName $name)
            }
            Set-Item "Env:YUKI_SETUP_BASE_$($version.Substring(0,3).Replace('.', '_'))" (Join-Path $directory.FullName $asset)
          }
          $env:PYTHONPATH = Join-Path (Get-Location) 'ci'
          cargo fetch --locked --manifest-path tools/yuki-setup/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $replay = Join-Path $env:RUNNER_TEMP 'yuki40'
          python -B ci/check.py EXT-040 --preparation --out $replay
          $result = $LASTEXITCODE
          Copy-Item -LiteralPath $replay -Destination ../windows-evidence -Recurse
          exit $result
      - name: Upload Windows candidate and replay evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: extension-windows-${{ github.run_attempt }}
          path: |
            windows-evidence/
            core/artifacts/extension-windows/candidate/
            core/artifacts/extension-windows/producer/manifest.json
          if-no-files-found: warn
          retention-days: 30

  select:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      units: ${{ steps.affected.outputs.units }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select changed independent release units
        id: affected
        shell: pwsh
        run: |
          $units = python ci/affected.py --event $env:GITHUB_EVENT_PATH
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "units=$units" >> $env:GITHUB_OUTPUT

  acceptance:
    if: github.event_name != 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check bounded asset transport and retained contract integrity
        run: python -m unittest discover -s tests/unit -p test_download_http.py -v
      - name: Check cache isolation and package integrity
        run: python -m unittest discover -s tests/unit -p test_ci_cache.py -v
      - name: Restore checksum-verified crate distributions
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.YUKI_CRATE_CACHE }}
          key: crates-v1-${{ runner.os }}-${{ runner.arch }}-rust-1.90.0-1.96.0-${{ hashFiles('**/Cargo.lock', '**/rust-toolchain.toml', 'compat/**/*.crate', 'ci/handshake_cargo.py') }}
      - name: Install pinned build tool
        run: python -m pip install --disable-pip-version-check uv==0.12.0
      - name: Install pinned fixture Rust compiler
        run: rustup toolchain install 1.90.0 --profile minimal
      - name: EXT-001 independent packages and fault cases
        run: python ci/check.py EXT-001 --out artifacts/EXT-001/ci
      - name: Install the handshake SDK compiler
        run: rustup toolchain install 1.96.0 --profile minimal
      - name: EXT-002 released SDK consumer parity
        run: python ci/check.py EXT-002 --out artifacts/EXT-002/ci
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - name: EXT-019 pinned Desktop consumer surface
        run: python ci/check.py EXT-019 --out artifacts/EXT-019/ci
      - name: Compare Desktop witness with the Windows reference
        shell: python
        run: |
          from hashlib import sha256
          from pathlib import Path
          root = Path("artifacts/EXT-019")
          name = "desktop-callsite-pin.json"
          expected = sha256((root / "03" / name).read_bytes()).hexdigest()
          actual = sha256((root / "ci" / name).read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit(f"Desktop witness SHA-256 differs: {actual} != {expected}")
          print(f"Desktop witness SHA-256: {actual}")
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-${{ matrix.os }}-${{ github.sha }}
          path: |
            artifacts/EXT-001/ci/*.json
            artifacts/EXT-001/ci/*.txt
            artifacts/EXT-002/ci/*.json
            artifacts/EXT-002/ci/*.txt
            artifacts/EXT-019/ci/*.json
            artifacts/EXT-019/ci/*.txt
          if-no-files-found: error

  monty-runtime:
    name: runtime (monty-runtime, ubuntu-latest)
    needs: select
    if: contains(fromJSON(needs.select.outputs.units), 'monty-runtime')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ensure the Linux image policy parser is installed
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apparmor
      - run: rustup toolchain install 1.96.0 --profile minimal
      - name: Build and exercise the native Monty image with enforced isolation
        run: python ci/monty_linux_check.py --out dist/monty-runtime-native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-monty-runtime-ubuntu-latest-${{ github.sha }}
          path: dist/monty-runtime-native/
          if-no-files-found: error

  codemode-worker:
    name: worker (codemode, ${{ matrix.os }})
    needs: select
    if: contains(fromJSON(needs.select.outputs.units), 'monty-runtime')
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: rustup toolchain install 1.96.0 --profile minimal
      - run: python ci/codemode_worker_check.py --out dist/codemode-worker
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: worker-codemode-${{ matrix.os }}-${{ github.sha }}
          path: |
            dist/codemode-worker/manifest.json
            dist/codemode-worker/*.txt
          if-no-files-found: error

  package:
    needs: select
    if: needs.select.outputs.units != '[]'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        unit: ${{ fromJSON(needs.select.outputs.units) }}
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check uv==0.12.0
      - name: Identify the actual compiler, source, lock and SDK cache inputs
        id: rust-cache
        shell: pwsh
        run: |
          python ci/rust_cache.py --unit ${{ matrix.unit }} --github-output $env:GITHUB_OUTPUT --receipt artifacts/ci-cache/${{ matrix.unit }}.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Restore this Rust unit's verified distributions and build outputs
        if: steps.rust-cache.outputs.enabled == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.YUKI_CRATE_CACHE }}
            ${{ github.workspace }}/.ci-transfer/rust-cache/target/${{ matrix.unit }}/${{ steps.rust-cache.outputs.digest }}
          key: ${{ steps.rust-cache.outputs.key }}
      - name: Exercise the Linux Rust env consumer against the original Manager socket
        if: matrix.unit == 'env' && runner.os == 'Linux'
        env:
          YUKI_RUST_CACHE_ROOT: ${{ github.workspace }}/.ci-transfer/rust-cache
        run: python ci/env_linux_check.py --out dist/env
      - name: Build only the selected release unit
        if: matrix.unit != 'env' || runner.os != 'Linux'
        env:
          YUKI_RUST_CACHE_ROOT: ${{ github.workspace }}/.ci-transfer/rust-cache
        run: python ci/package.py --unit ${{ matrix.unit }} --out dist/${{ matrix.unit }}
      - name: Verify OCI source packaging and archive integrity faults
        if: matrix.unit == 'monty-runtime'
        run: python -m unittest discover -s tests/unit -p test_oci_package.py -v
      - name: Preserve native failure evidence without masking the failed gate
        if: matrix.unit == 'monty-runtime'
        run: python -m unittest discover -s tests/unit -p test_monty_ci_evidence.py -v
      - name: Validate the offline direct Compose configuration
        if: matrix.unit == 'yuki-setup' && runner.os == 'Linux'
        run: docker compose -f deploy/compose/direct.yaml config --quiet
      - name: Install and upgrade the Connector candidate
        if: matrix.unit == 'connector'
        env:
          YUKI_CONNECTOR_PACKAGE_DIR: dist/connector
        run: python ci/check.py EXT-007 --out artifacts/EXT-007/candidate-ci
      - name: Check Codex native driver
        if: matrix.unit == 'connector'
        run: python ci/check.py EXT-008 --out artifacts/EXT-008/ci
      - name: Check Claude native SDK
        if: matrix.unit == 'connector'
        run: python ci/check.py EXT-009 --out artifacts/EXT-009/ci
      - name: Check ACP native v1
        if: matrix.unit == 'connector'
        run: python ci/check.py EXT-010 --out artifacts/EXT-010/ci
      - name: Upload Connector acceptance evidence
        if: always() && matrix.unit == 'connector'
        uses: actions/upload-artifact@v4
        with:
          name: connector-upgrade-${{ matrix.os }}-${{ github.sha }}
          path: |
            artifacts/EXT-007/candidate-ci/*.json
            artifacts/EXT-008/ci/*.json
            artifacts/EXT-008/ci/*.txt
            artifacts/EXT-009/ci/*.json
            artifacts/EXT-009/ci/*.txt
            artifacts/EXT-010/ci/*.json
            artifacts/EXT-010/ci/*.txt
            artifacts/EXT-007/candidate-ci/*.xml
            artifacts/EXT-007/candidate-ci/*.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.unit }}-${{ matrix.os }}-${{ github.sha }}
          path: dist/${{ matrix.unit }}/
          if-no-files-found: error
      - name: Upload actual build cache inputs
        if: always() && steps.rust-cache.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cache-inputs-${{ matrix.unit }}-${{ matrix.os }}-${{ github.sha }}
          path: artifacts/ci-cache/${{ matrix.unit }}.json
          if-no-files-found: error
