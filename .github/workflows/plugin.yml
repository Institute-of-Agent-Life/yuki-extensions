name: independent-units

on:
  push:
    # PRs run on the merge ref; a feature-branch push would duplicate that run.
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Only superseded runs for the same PR are cancelled. Main and manual runs
# retain unique groups, so they cannot cancel each other.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-run-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONUTF8: "1"

permissions:
  contents: read

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      units: ${{ steps.affected.outputs.units }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select changed independent release units
        id: affected
        shell: pwsh
        run: |
          $units = python ci/affected.py --event $env:GITHUB_EVENT_PATH
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "units=$units" >> $env:GITHUB_OUTPUT

  acceptance:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check bounded asset transport and retained contract integrity
        run: python -m unittest discover -s tests/unit -p test_download_http.py -v
      - name: Install pinned build tool
        run: python -m pip install --disable-pip-version-check uv==0.12.0
      - name: Install pinned fixture Rust compiler
        run: rustup toolchain install 1.90.0 --profile minimal
      - name: EXT-001 independent packages and fault cases
        run: python ci/check.py EXT-001 --out artifacts/EXT-001/ci
      - name: Install the handshake SDK compiler
        run: rustup toolchain install 1.96.0 --profile minimal
      - name: EXT-002 released SDK consumer parity
        run: python ci/check.py EXT-002 --out artifacts/EXT-002/ci
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - name: EXT-019 pinned Desktop consumer surface
        run: python ci/check.py EXT-019 --out artifacts/EXT-019/ci
      - name: Compare Desktop witness with the Windows reference
        shell: python
        run: |
          from hashlib import sha256
          from pathlib import Path
          root = Path("artifacts/EXT-019")
          name = "desktop-callsite-pin.json"
          expected = sha256((root / "03" / name).read_bytes()).hexdigest()
          actual = sha256((root / "ci" / name).read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit(f"Desktop witness SHA-256 differs: {actual} != {expected}")
          print(f"Desktop witness SHA-256: {actual}")
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-${{ matrix.os }}-${{ github.sha }}
          path: |
            artifacts/EXT-001/ci/*.json
            artifacts/EXT-001/ci/*.txt
            artifacts/EXT-002/ci/*.json
            artifacts/EXT-002/ci/*.txt
            artifacts/EXT-019/ci/*.json
            artifacts/EXT-019/ci/*.txt
          if-no-files-found: error

  package:
    needs: select
    if: needs.select.outputs.units != '[]'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        unit: ${{ fromJSON(needs.select.outputs.units) }}
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check uv==0.12.0
      - name: Exercise the Linux Rust env consumer against the original Manager socket
        if: matrix.unit == 'env' && runner.os == 'Linux'
        run: python ci/env_linux_check.py --out dist/env
      - name: Build only the selected release unit
        if: matrix.unit != 'env' || runner.os != 'Linux'
        run: python ci/package.py --unit ${{ matrix.unit }} --out dist/${{ matrix.unit }}
      - name: Validate the offline direct Compose configuration
        if: matrix.unit == 'yuki-setup' && runner.os == 'Linux'
        run: docker compose -f deploy/compose/direct.yaml config --quiet
      - name: Install and upgrade the Connector candidate
        if: matrix.unit == 'connector'
        env:
          YUKI_CONNECTOR_PACKAGE_DIR: dist/connector
        run: python ci/check.py EXT-007 --out artifacts/EXT-007/candidate-ci
      - name: Check Codex native driver
        if: matrix.unit == 'connector'
        run: python ci/check.py EXT-008 --out artifacts/EXT-008/ci
      - name: Check Claude native SDK
        if: matrix.unit == 'connector'
        run: python ci/check.py EXT-009 --out artifacts/EXT-009/ci
      - name: Check ACP native v1
        if: matrix.unit == 'connector'
        run: python ci/check.py EXT-010 --out artifacts/EXT-010/ci
      - name: Upload Connector acceptance evidence
        if: always() && matrix.unit == 'connector'
        uses: actions/upload-artifact@v4
        with:
          name: connector-upgrade-${{ matrix.os }}-${{ github.sha }}
          path: |
            artifacts/EXT-007/candidate-ci/*.json
            artifacts/EXT-008/ci/*.json
            artifacts/EXT-008/ci/*.txt
            artifacts/EXT-009/ci/*.json
            artifacts/EXT-009/ci/*.txt
            artifacts/EXT-010/ci/*.json
            artifacts/EXT-010/ci/*.txt
            artifacts/EXT-007/candidate-ci/*.xml
            artifacts/EXT-007/candidate-ci/*.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.unit }}-${{ matrix.os }}-${{ github.sha }}
          path: dist/${{ matrix.unit }}/
          if-no-files-found: error
