services:
  core:
    image: yuki-core@sha256:d716bd4e692f421afd2d623264579a2702104bc4bbb8a7ba3299a7ae026977df
    platform: linux/arm64
    pull_policy: never
    user: '65532:65532'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
