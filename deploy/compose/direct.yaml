          sed -i 's/^listen = "127\.0\.0\.1:0"$$/listen = "127.0.0.1:8080"/' "$$stage/yuki.toml"
          mv -T --no-clobber "$$stage" /var/tmp/yuki
          rm -rf -- "$$stage"
          trap - EXIT
        fi
        exec yuki-core --data /var/tmp/yuki run
    healthcheck:
      test:
        - CMD
